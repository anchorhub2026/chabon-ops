<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>調理チェックリスト | Chabon Ops</title>
<style>
  :root{
    --main: #4a7c59;
    --main-dark: #335c3e;
    --main-light: #e9f1ea;
    --accent: #c9533f;
    --bg: #faf8f3;
    --card: #ffffff;
    --ink: #2b2b28;
    --line: #e2ddd0;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header{
    background: var(--main-dark);
    color: #fff;
    padding: 16px 14px;
    text-align: center;
  }
  header h1{ margin: 0; font-size: 1.15rem; letter-spacing: 0.04em; }
  header p{ margin: 5px 0 0; font-size: 0.76rem; opacity: 0.85; }
  .header-nav{ margin-top: 10px; }
  .header-nav a{
    display: inline-block;
    color: #fff;
    text-decoration: none;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 100px;
    padding: 5px 14px;
    font-size: 0.76rem;
    margin: 2px 4px;
  }
  main{
    max-width: 680px;
    margin: 0 auto;
    padding: 12px 10px 60px;
  }
  section.card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
  }
  section.card h2{
    margin: 0 0 10px;
    font-size: 0.92rem;
    color: var(--main-dark);
  }
  .section-header-row{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .section-header-row h2{ margin: 0; }

  /* スマホで片手操作しやすいよう、タップ対象は最低44pxを確保する */
  .refresh-btn{
    min-height: 44px;
    padding: 0 16px;
    background: #fff;
    color: var(--main-dark);
    border: 1px solid var(--main);
    border-radius: 100px;
    font-size: 0.82rem;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .refresh-btn:active{ background: var(--main-light); }
  .refresh-btn.loading{ opacity: 0.6; }

  .preset-btn-row{
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .preset-btn{
    flex: 1;
    min-width: 72px;
    min-height: 44px;
    background: var(--main-light);
    color: var(--main-dark);
    border: 1px solid var(--main);
    border-radius: 10px;
    padding: 8px 6px;
    font-size: 0.84rem;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }
  .preset-btn:active{ background: #dcebe0; }

  .date-list{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px;
  }
  .date-item{
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 0.85rem;
    cursor: pointer;
    user-select: none;
  }
  .date-item:has(input:checked){
    background: var(--main-light);
    border-color: var(--main);
    color: var(--main-dark);
    font-weight: bold;
  }
  .date-item input[type="checkbox"]{
    width: 20px;
    height: 20px;
    accent-color: var(--main);
    flex-shrink: 0;
  }
  .no-dates-note{ text-align: center; color: #999; font-size: 0.84rem; padding: 10px 0; }

  /* 具材ごとの残りカード */
  .filling-row{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    min-height: 44px;
    cursor: pointer;
    background: #fff;
  }
  .filling-row:active{ background: #f5f4f0; }
  .filling-row.done{ background: #f5f4f0; border-color: #ddd; }
  .filling-row.done .filling-name{ color: #999; }
  .filling-name{
    font-size: 0.92rem;
    font-weight: bold;
    color: var(--main-dark);
  }
  .filling-done-badge{
    display: inline-block;
    margin-left: 6px;
    font-size: 0.72rem;
    color: var(--main);
    font-weight: bold;
  }
  .filling-nums{ text-align: right; flex-shrink: 0; }
  .filling-remaining{
    font-size: 1.3rem;
    font-weight: bold;
    color: var(--accent);
    line-height: 1.1;
  }
  .filling-remaining.zero{ color: var(--main); font-size: 1rem; }
  .filling-sub{ font-size: 0.72rem; color: #888; margin-top: 2px; }
  .filling-chevron{ color: #bbb; font-size: 1.1rem; flex-shrink: 0; }

  .section-divider{
    border: none;
    border-top: 1px dashed var(--line);
    margin: 14px 0 10px;
  }
  .done-section-label{
    font-size: 0.78rem;
    color: #999;
    margin: 4px 0 8px;
  }

  .summary-note{
    text-align: center;
    font-size: 0.82rem;
    color: #888;
    margin-top: 4px;
  }
  .loading{ text-align: center; color: #999; padding: 30px 0; }
  .off-note{ text-align: center; color: #999; padding: 20px 0; }

  /* ── 詳細モーダル（内訳・チェック） ── */
  .modal-overlay{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    align-items: flex-end;
    justify-content: center;
    z-index: 1000;
  }
  .modal-overlay.show{ display: flex; }
  .modal-box{
    background: #fff;
    width: 100%;
    max-width: 480px;
    max-height: 86vh;
    overflow-y: auto;
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.2);
  }
  .modal-head{
    position: sticky;
    top: 0;
    background: var(--main-dark);
    color: #fff;
    padding: 14px 16px;
    font-weight: bold;
    font-size: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 2;
  }
  .modal-close-x{
    background: none;
    border: none;
    color: #fff;
    font-size: 1.3rem;
    cursor: pointer;
    min-width: 44px;
    min-height: 44px;
  }
  .modal-body{ padding: 10px 14px 18px; }
  .modal-bulk-row{ margin-bottom: 10px; }
  .bulk-complete-btn{
    width: 100%;
    min-height: 48px;
    background: var(--main);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }
  .bulk-complete-btn:active{ background: var(--main-dark); }
  .detail-day-heading{
    font-size: 0.8rem;
    font-weight: bold;
    color: #888;
    margin: 12px 0 6px;
  }
  .detail-day-heading:first-of-type{ margin-top: 2px; }
  .detail-row{
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .detail-row-head{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .detail-dest-name{ font-weight: bold; font-size: 0.88rem; color: var(--ink); }
  .detail-qty{ font-size: 0.86rem; color: var(--main-dark); font-weight: bold; }
  .detail-btn-row{ display: flex; gap: 8px; }
  .status-btn{
    flex: 1;
    min-height: 44px;
    padding: 0 8px;
    font-size: 0.82rem;
    font-weight: bold;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: #fff;
    color: #666;
    cursor: pointer;
    font-family: inherit;
  }
  .status-btn.cooked.active{ background: var(--main); color: #fff; border-color: var(--main); }
  .status-btn.handed.active{ background: var(--accent); color: #fff; border-color: var(--accent); }
  .status-btn:active{ opacity: 0.8; }
  .conflict-msg{
    font-size: 0.76rem;
    color: var(--accent);
    font-weight: bold;
    text-align: center;
    padding: 6px 0;
  }

  /* ── 確認ダイアログ（showConfirm用。admin.htmlと同じ仕組み） ── */
  .confirm-overlay{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 20px;
  }
  .confirm-overlay.show{ display: flex; }
  .confirm-box{
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    max-width: 320px;
    width: 100%;
    text-align: center;
  }
  .confirm-message{ font-size: 0.92rem; margin-bottom: 16px; white-space: pre-line; }
  .confirm-btn-row{ display: flex; gap: 10px; }
  .confirm-btn{
    flex: 1;
    min-height: 44px;
    border-radius: 10px;
    border: 1px solid var(--line);
    font-size: 0.88rem;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }
  .confirm-yes{ background: var(--main); color: #fff; border-color: var(--main); }
  .confirm-no{ background: #fff; color: #666; }

  @media (max-width: 480px){
    main{ padding: 10px 6px 50px; }
    section.card{ padding: 10px; }
  }
</style>
</head>
<body>

<header>
  <h1>🍳 調理チェックリスト</h1>
  <p>数日分をまとめて調理するときの、残り・担当のチェックリストです</p>
  <nav class="header-nav">
    <a href="admin.html">← 管理画面</a>
  </nav>
</header>

<main>
  <section class="card">
    <div class="section-header-row">
      <h2>対象の日数を選ぶ</h2>
      <button type="button" class="refresh-btn" id="refreshBtn">🔄 更新</button>
    </div>
    <div class="preset-btn-row" id="presetBtnRow"></div>
    <div id="dateListArea"><p class="loading">読み込み中...</p></div>
  </section>

  <section class="card">
    <h2>具材ごとの残り</h2>
    <div id="checklistArea"><p class="off-note">日付を選択すると表示されます。</p></div>
    <p class="summary-note" id="summaryNote"></p>
  </section>
</main>

<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <div class="modal-head">
      <span id="modalFillingName"></span>
      <button type="button" class="modal-close-x" id="modalCloseBtn">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-message" id="confirmMessage"></div>
    <div class="confirm-btn-row">
      <button type="button" class="confirm-btn confirm-no" id="confirmNoBtn">キャンセル</button>
      <button type="button" class="confirm-btn confirm-yes" id="confirmYesBtn">OK</button>
    </div>
  </div>
</div>

<script src="confirmed-plan.js"></script>
<script>
const SHIFT_SPREADSHEET_ID = "1PHf1o3smqIQdeFkhBHjBZUEub7VtRcynQLllmSR7w-s"; // 作業中プラン・確定プラン・具材ステータス
const CHISE_SPREADSHEET_ID = "1rQtRUSP5e7qOjnT4RPvMGfWrEFcFL89AsLe8cjGIW4U"; // チセさんの生産データ
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyxbKMgM4ZiowaJu3cQ4NdLhwSE9-Pet8DbYB3qvgEX2NS2h1Dosgfm62vu7-in52ZT/exec";
const DAY_NAMES = ["日", "月", "火", "水", "木", "金", "土"];

// admin.htmlと同じ9種類の具材・本部固定具材（枝豆・梅・うなぎは常に本部製造）
const FILLINGS = ["ツナマヨ", "スパイシーツナマヨ", "テリヤキチキン", "サーモン", "スパイシー味噌", "枝豆", "梅", "うなぎ", "今月のおにぎり"];
const ALWAYS_HQ_FILLINGS = ["枝豆", "梅", "うなぎ"];

// 渡し先の種類（ニギニギ隊の各メンバーに加えて、本部・チセの2種類を扱う）。
// 「具材ステータス」シートの「メンバー」列はただの自由文字列のため、これらの名前を
// そのまま保存できる（既存のニギニギ隊メンバー名の行とは完全に独立して共存する）。
const DEST_HQ = "本部";
const DEST_CHISE_ONIGIRI = "チセ(おにぎり)";
const DEST_CHISE_KONOMI = "チセ(具材のみ)";

// CTH特別会場（期間限定）: admin.html/cth-calendar.htmlと同じ定義。
// 作業中プランがまだ編集されていないCTH期間中の日は、UvA枠がCTH固定50個の標準比率按分に
// フォールバックする（cth-calendar.htmlのおにぎり表示と同じ扱い）。
const CTH_SPECIAL_START = "2026-08-24";
const CTH_SPECIAL_END = "2026-09-11";
const CTH_SPECIAL_QTY = 50;
const FILLING_RATIOS = {
  "スパイシーツナマヨ": 0.2234,
  "テリヤキチキン": 0.1966,
  "サーモン": 0.1966,
  "ツナマヨ": 0.1340,
  "スパイシー味噌": 0.0894,
  "枝豆": 0.04,
  "梅": 0.02,
  "うなぎ": 0.05,
  "今月のおにぎり": 0.05,
};
function isCthSpecialDay(iso){
  const dow = new Date(`${iso}T00:00:00`).getDay();
  return dow >= 1 && dow <= 5 && iso >= CTH_SPECIAL_START && iso <= CTH_SPECIAL_END;
}
function buildFillingDefaults(total){
  const obj = {};
  Object.keys(FILLING_RATIOS).forEach(f => { obj[f] = Math.round(total * FILLING_RATIOS[f]); });
  return obj;
}

const LOCAL_STORAGE_KEY = "chabon_cooking_selected_dates";

const state = {
  candidates: [],        // [{iso, dow, dateObj}]（選択肢に出せる日。対象外の日は含まない）
  selected: new Set(),   // 選択中のiso
  draftByDate: {},        // iso -> {zuidFillingQty, uvaFillingQty, zuidOpen, uvaOpen, prod:{member:{filling:qty}}}
  chiseByLabel: {},       // "M/d" -> {breakdown, konomiBreakdown}
  confirmedPlanByDate: {}, // "M/d" -> 確定プラン（confirmed-plan.js の parseConfirmedPlansSheet 参照）
  cellStatus: {},         // iso -> dest -> filling -> {handed, cooked, updatedAtRaw}
  openFilling: null,      // 詳細モーダルで開いている具材名
  conflictNotice: null,   // 楽観的ロックの競合メッセージ（詳細モーダル内に表示）
};

function pad(n){ return String(n).padStart(2, "0"); }
function isoDate(d){ return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function mdLabel(d){ return `${d.getMonth() + 1}/${d.getDate()}`; }
function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate() + n); return r; }

function getMonday(date){
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function escapeHtml(str){
  return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function fetchGvizSheet(spreadsheetId, sheetName){
  const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:json` +
    (sheetName ? `&sheet=${encodeURIComponent(sheetName)}` : "");
  const res = await fetch(url, { cache: "no-store" });
  const text = await res.text();
  const match = text.match(/setResponse\(([\s\S]*)\);\s*$/);
  if(!match) throw new Error("シートの解析に失敗しました: " + sheetName);
  return JSON.parse(match[1]);
}

// gvizの日付型セルを "yyyy-MM-dd" のISO文字列に変換する（admin.html/index.htmlと同じ方式）
function parseGvizDateCell(cell){
  if(!cell || cell.v === null || cell.v === undefined) return null;
  const v = cell.v;
  if(typeof v === "string"){
    const m = v.match(/^Date\((\d+),(\d+),(\d+)/);
    if(m){
      const y = parseInt(m[1], 10), mo = parseInt(m[2], 10) + 1, d = parseInt(m[3], 10);
      return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    }
    if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  }
  return null;
}

// 作業中プランから日付ごとのZuid/UvA(CTH)具材内訳・営業フラグ・メンバー別の生産割り振り(prod)を
// 取り出す。prodはadmin.htmlが生産割り振りを保存したときの内容（確定プランが無い日の、
// 現時点での「誰が何を作る予定か」）。admin.htmlで一度も編集されていない日はprodが空になる。
// ※確定プランがある日は具材別の内訳・メンバー別の割り振りも確定プランから取る
// （getDayBreakdown参照）。確定プランがまだ無い日のみ、この作業中プランの内訳を使う。
function parseDraftByDate(json){
  const result = {};
  if(!json || !json.table || !json.table.rows) return result;
  json.table.rows.forEach(r => {
    const c = r.c;
    if(!c || !c[0]) return;
    const dateStr = parseGvizDateCell(c[0]);
    if(!dateStr) return;
    try{
      const forecast = JSON.parse((c[1] && c[1].v) || "{}");
      const prod = JSON.parse((c[2] && c[2].v) || "{}");
      result[dateStr] = {
        zuidFillingQty: forecast.zuidFillingQty || {},
        uvaFillingQty: forecast.uvaFillingQty || {},
        zuidOpen: forecast.zuidOpen,
        uvaOpen: forecast.uvaOpen,
        prod,
      };
    }catch(e){ /* 壊れたJSON行は無視する */ }
  });
  return result;
}

// 「具材のみ」の行名（例: "テリヤキ(具材のみ)"）から、対応するおにぎりの具材名
// （例: "テリヤキチキン"）を判定する。全角・半角どちらのカッコ表記にも対応する。
const KONOMI_ROW_PATTERN = /[\(（]\s*具材のみ\s*[\)）]/;
const KONOMI_ROW_PREFIXES = [
  { prefix: "テリヤキ", filling: "テリヤキチキン" },
  { prefix: "サーモン", filling: "サーモン" },
];
function matchKonomiFilling(rawName){
  if(!KONOMI_ROW_PATTERN.test(rawName)) return null;
  const match = KONOMI_ROW_PREFIXES.find(p => rawName.startsWith(p.prefix));
  return match ? match.filling : null;
}

// チセさんの生産データ（商品×日付の横持ち表）を解析する（admin.htmlのparseChiseSheetと同じロジック）。
// 「具材のみ」の行（例: "テリヤキ(具材のみ)"）は、おにぎり個数の集計（breakdown）とは
// 混ぜず、別のkonomiBreakdownに保持する
function parseChiseSheet(json){
  const result = {};
  const rawRows = (json && json.table && json.table.rows) || [];
  if(rawRows.length === 0) return result;

  const dateRowCells = rawRows[0].c || [];
  const dateCols = [];
  dateRowCells.forEach((cell, idx) => {
    const f = cell && cell.f;
    if(f && /^\d{1,2}\/\d{1,2}$/.test(f)) dateCols.push({ idx, label: f });
  });

  const rows = rawRows.map(r => (r.c || []).map(c => (c ? c.v : null)));
  const cellLabel = v => (v === null || v === undefined) ? "" : String(v).trim();
  let startRow = -1, endRow = -1;
  rows.forEach((r, i) => {
    if(cellLabel(r[0]) === "商品") startRow = i + 1;
    if(cellLabel(r[0]) === "SUB TOTAL" && startRow !== -1 && endRow === -1) endRow = i;
  });
  if(startRow === -1 || endRow === -1) return result;

  dateCols.forEach(({ idx, label }) => {
    const breakdown = {};
    const konomiBreakdown = {};
    for(let i = startRow; i < endRow; i++){
      const name = cellLabel(rows[i][0]);
      const rawQty = rows[i][idx];
      const qty = typeof rawQty === "number" ? rawQty
        : (typeof rawQty === "string" && rawQty.trim() !== "" && !isNaN(Number(rawQty)) ? Number(rawQty) : null);
      if(!name || qty === null) continue;
      const konomiFilling = matchKonomiFilling(name);
      if(konomiFilling) konomiBreakdown[konomiFilling] = (konomiBreakdown[konomiFilling] || 0) + qty;
      else breakdown[name] = qty;
    }
    result[label] = { breakdown, konomiBreakdown };
  });
  return result;
}

// 「具材ステータス」シートを iso -> 渡し先 -> 具材 -> {handed, cooked, updatedAtRaw} にパースする。
// updatedAtRawは保存直前の楽観的ロック確認用（gvizのDate型セルの生シリアライズ値）。
function parseCellStatusSheet(json){
  const result = {};
  const rows = (json && json.table && json.table.rows) || [];
  rows.forEach(r => {
    const c = r.c;
    if(!c || !c[0]) return;
    const iso = parseGvizDateCell(c[0]);
    if(!iso) return;
    const dest = String((c[1] && c[1].v) || "").trim();
    const filling = String((c[2] && c[2].v) || "").trim();
    if(!dest || !filling) return;
    const handed = !!(c[3] && c[3].v === true);
    const cooked = !!(c[4] && c[4].v === true);
    const updatedAtRaw = (c[5] && c[5].v !== undefined && c[5].v !== null) ? String(c[5].v) : null;
    if(!result[iso]) result[iso] = {};
    if(!result[iso][dest]) result[iso][dest] = {};
    result[iso][dest][filling] = { handed, cooked, updatedAtRaw };
  });
  return result;
}

function getStatus(iso, dest, filling){
  return (state.cellStatus[iso] && state.cellStatus[iso][dest] && state.cellStatus[iso][dest][filling])
    || { handed: false, cooked: false, updatedAtRaw: null };
}
function setStatus(iso, dest, filling, value){
  if(!state.cellStatus[iso]) state.cellStatus[iso] = {};
  if(!state.cellStatus[iso][dest]) state.cellStatus[iso][dest] = {};
  state.cellStatus[iso][dest][filling] = value;
}

/* ---------- 1日分の渡し先別内訳（ニギニギ隊各メンバー／本部／チセおにぎり／チセ具材のみ） ---------- */
// 確定プランがある日は確定プランの内訳を最優先で使う（admin.htmlで実装した確定プランの
// 読み込み処理＝confirmed-plan.jsを共通利用）。確定プランが無い日は作業中プランから出す。
// 作業中プランにメンバー別の割り振り(prod)が保存されていない日（admin.htmlでまだ一度も
// 編集されていない日）は、誰の担当か分からないため、必要数の全量を本部（未割り当て分の
// 受け皿）に計上する。
function getDayBreakdown(iso){
  const mdKey = mdLabel(new Date(`${iso}T00:00:00`));
  const confirmed = state.confirmedPlanByDate[mdKey];
  const chiseEntry = state.chiseByLabel[mdKey];

  const chiseKonomi = {};
  FILLINGS.forEach(f => { chiseKonomi[f] = (chiseEntry && chiseEntry.konomiBreakdown && chiseEntry.konomiBreakdown[f]) || 0; });

  if(confirmed && confirmed.hasDetailBreakdown){
    const membersBreakdown = {};
    (confirmed.memberNames || []).forEach(name => {
      membersBreakdown[name] = {};
      FILLINGS.forEach(f => { membersBreakdown[name][f] = (confirmed.memberFillingQty[name] && confirmed.memberFillingQty[name][f]) || 0; });
    });
    const hq = {};
    FILLINGS.forEach(f => { hq[f] = (confirmed.hqBreakdown && confirmed.hqBreakdown[f]) || 0; });
    const chiseOnigiri = {};
    FILLINGS.forEach(f => { chiseOnigiri[f] = (confirmed.chiseBreakdown && confirmed.chiseBreakdown[f]) || 0; });
    return { membersBreakdown, hq, chiseOnigiri, chiseKonomi, source: "confirmed" };
  }

  const draft = state.draftByDate[iso];
  const membersBreakdown = {};
  if(draft && draft.prod){
    Object.keys(draft.prod).forEach(name => {
      membersBreakdown[name] = {};
      FILLINGS.forEach(f => { membersBreakdown[name][f] = (draft.prod[name] && draft.prod[name][f]) || 0; });
    });
  }

  const chiseOnigiri = {};
  FILLINGS.forEach(f => { chiseOnigiri[f] = (chiseEntry && chiseEntry.breakdown && chiseEntry.breakdown[f]) || 0; });

  const zuidQty = {}, uvaQty = {};
  if(draft){
    FILLINGS.forEach(f => {
      zuidQty[f] = (draft.zuidOpen !== false) ? (draft.zuidFillingQty[f] || 0) : 0;
      uvaQty[f] = (draft.uvaOpen !== false) ? (draft.uvaFillingQty[f] || 0) : 0;
    });
  } else if(isCthSpecialDay(iso)){
    // 作業中プランが未編集でもCTH期間中は標準比率で50個按分したデフォルト値を暫定的に使う
    const defaults = buildFillingDefaults(CTH_SPECIAL_QTY);
    FILLINGS.forEach(f => { uvaQty[f] = defaults[f] || 0; });
  }

  const hq = {};
  FILLINGS.forEach(f => {
    const needed = (zuidQty[f] || 0) + (uvaQty[f] || 0) + (chiseOnigiri[f] || 0);
    if(ALWAYS_HQ_FILLINGS.includes(f)){
      // 枝豆・梅・うなぎは常に本部製造（ニギニギ隊には割り振らない。admin.htmlと同じルール）
      hq[f] = needed;
    } else {
      const producedByMembers = Object.values(membersBreakdown).reduce((s, m) => s + (m[f] || 0), 0);
      hq[f] = Math.max(0, needed - producedByMembers);
    }
  });

  return { membersBreakdown, hq, chiseOnigiri, chiseKonomi, source: draft ? "draft" : "none" };
}

/* ---------- 対象の日数を選ぶ ---------- */
// 選択肢に出す日＝「明日」以降・日曜日ではない・確定プランか作業中プランかチセのデータが
// 何かしらある日。何も無い日（店が休みの日・まだ何も予定が無い日）は選択肢に出さない。
function hasDataForDate(iso){
  const mdKey = mdLabel(new Date(`${iso}T00:00:00`));
  if(state.confirmedPlanByDate[mdKey]) return true;
  if(state.draftByDate[iso]) return true;
  const chiseEntry = state.chiseByLabel[mdKey];
  if(chiseEntry){
    if(chiseEntry.breakdown && Object.keys(chiseEntry.breakdown).length > 0) return true;
    if(chiseEntry.konomiBreakdown && Object.keys(chiseEntry.konomiBreakdown).length > 0) return true;
  }
  return false;
}

function buildCandidateDates(){
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const list = [];
  for(let i = 1; i <= 14; i++){
    const d = addDays(today, i);
    if(d.getDay() === 0) continue; // 日曜日は対象外（Zuid・UvAとも休業）
    const iso = isoDate(d);
    if(!hasDataForDate(iso)) continue;
    list.push({ iso, dow: d.getDay(), dateObj: d });
  }
  return list;
}

function presetDates(mode){
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  if(mode === "tomorrow"){
    const iso = isoDate(addDays(today, 1));
    return state.candidates.filter(d => d.iso === iso).map(d => d.iso);
  }
  if(mode === "2days" || mode === "3days"){
    const maxOffset = mode === "2days" ? 2 : 3;
    return state.candidates.filter(d => {
      const diff = Math.round((d.dateObj - today) / 86400000);
      return diff >= 1 && diff <= maxOffset;
    }).map(d => d.iso);
  }
  if(mode === "restOfWeek"){
    const monday = getMonday(today);
    const weekEnd = addDays(monday, 5); // 今週の土曜日まで
    return state.candidates.filter(d => d.dateObj > today && d.dateObj <= weekEnd).map(d => d.iso);
  }
  return [];
}

function loadSelectedFromStorage(){
  try{
    const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
    if(!raw) return null;
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : null;
  }catch(e){ return null; }
}
function saveSelectedToStorage(){
  try{ localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify([...state.selected])); }catch(e){}
}

function applyPreset(mode){
  const isos = presetDates(mode);
  state.selected = new Set(isos);
  saveSelectedToStorage();
  renderDateList();
  renderChecklist();
}

function renderPresetButtons(){
  const area = document.getElementById("presetBtnRow");
  area.innerHTML = `
    <button type="button" class="preset-btn" data-mode="tomorrow">明日</button>
    <button type="button" class="preset-btn" data-mode="2days">2日分</button>
    <button type="button" class="preset-btn" data-mode="3days">3日分</button>
    <button type="button" class="preset-btn" data-mode="restOfWeek">今週の残り</button>
  `;
  area.querySelectorAll(".preset-btn").forEach(btn => {
    btn.addEventListener("click", () => applyPreset(btn.dataset.mode));
  });
}

function renderDateList(){
  const area = document.getElementById("dateListArea");
  if(state.candidates.length === 0){
    area.innerHTML = `<p class="no-dates-note">選択できる日がありません（営業日の確定プラン・作業中プランがまだ無いようです）。</p>`;
    return;
  }
  const itemsHtml = state.candidates.map(d => {
    const checked = state.selected.has(d.iso) ? "checked" : "";
    return `
      <label class="date-item">
        <input type="checkbox" class="date-checkbox" data-iso="${d.iso}" ${checked}>
        ${d.dateObj.getMonth() + 1}/${d.dateObj.getDate()}（${DAY_NAMES[d.dow]}）
      </label>
    `;
  }).join("");
  area.innerHTML = `<div class="date-list">${itemsHtml}</div>`;
  area.querySelectorAll(".date-checkbox").forEach(cb => {
    cb.addEventListener("change", () => {
      if(cb.checked) state.selected.add(cb.dataset.iso);
      else state.selected.delete(cb.dataset.iso);
      saveSelectedToStorage();
      renderChecklist();
    });
  });
}

/* ---------- 具材ごとの残り一覧 ---------- */
// 選択中の日付それぞれについて、渡し先（メンバー各人／本部／チセおにぎり／チセ具材のみ）×
// 具材ごとの行（{iso, dest, destType, filling, qty}）に展開したフラットなリストを作る。
// 「調理済み」はこの行単位（日付×渡し先×具材）のON/OFFで管理するため、
// 集計（必要合計・調理済み・残り）もこのリストから行単位で積み上げる。
function buildRows(selectedIsos){
  const rows = [];
  selectedIsos.forEach(iso => {
    const bd = getDayBreakdown(iso);
    Object.keys(bd.membersBreakdown).forEach(name => {
      FILLINGS.forEach(f => {
        const qty = bd.membersBreakdown[name][f] || 0;
        if(qty > 0) rows.push({ iso, dest: name, destType: "member", filling: f, qty });
      });
    });
    FILLINGS.forEach(f => {
      const qty = bd.hq[f] || 0;
      if(qty > 0) rows.push({ iso, dest: DEST_HQ, destType: "hq", filling: f, qty });
    });
    FILLINGS.forEach(f => {
      const qty = bd.chiseOnigiri[f] || 0;
      if(qty > 0) rows.push({ iso, dest: DEST_CHISE_ONIGIRI, destType: "chise", filling: f, qty });
    });
    FILLINGS.forEach(f => {
      const qty = bd.chiseKonomi[f] || 0;
      if(qty > 0) rows.push({ iso, dest: DEST_CHISE_KONOMI, destType: "chise", filling: f, qty });
    });
  });
  return rows;
}

function aggregateByFilling(rows){
  const byFilling = {};
  FILLINGS.forEach(f => { byFilling[f] = { total: 0, cooked: 0, rows: [] }; });
  rows.forEach(r => {
    byFilling[r.filling].total += r.qty;
    byFilling[r.filling].rows.push(r);
    if(getStatus(r.iso, r.dest, r.filling).cooked) byFilling[r.filling].cooked += r.qty;
  });
  return byFilling;
}

function destLabel(dest, destType){
  return dest; // メンバー名・本部・チセ(おにぎり)・チセ(具材のみ)はそのまま表示名として使う
}

function renderChecklist(){
  const area = document.getElementById("checklistArea");
  const noteEl = document.getElementById("summaryNote");
  const selectedIsos = [...state.selected].sort();

  if(selectedIsos.length === 0){
    area.innerHTML = `<p class="off-note">日付を選択すると表示されます。</p>`;
    noteEl.textContent = "";
    return;
  }

  const rows = buildRows(selectedIsos);
  const byFilling = aggregateByFilling(rows);

  const entries = FILLINGS.map(f => ({ filling: f, ...byFilling[f] }))
    .filter(e => e.total > 0)
    .map(e => ({ ...e, remaining: e.total - e.cooked }));

  if(entries.length === 0){
    area.innerHTML = `<p class="off-note">選択した日に、必要な具材のデータがありません。</p>`;
    noteEl.textContent = `選択中：${selectedIsos.length}日分`;
    return;
  }

  // 残りが多い具材を上から表示し、残り0（完了）の具材は下にまとめる
  const remaining = entries.filter(e => e.remaining > 0).sort((a, b) => b.remaining - a.remaining);
  const done = entries.filter(e => e.remaining <= 0);

  const rowHtml = e => `
    <div class="filling-row${e.remaining <= 0 ? " done" : ""}" data-filling="${escapeHtml(e.filling)}">
      <div>
        <span class="filling-name">${escapeHtml(e.filling)}</span>
        ${e.remaining <= 0 ? `<span class="filling-done-badge">✓完了</span>` : ""}
      </div>
      <div class="filling-nums">
        <div class="filling-remaining${e.remaining <= 0 ? " zero" : ""}">${e.remaining <= 0 ? "0" : e.remaining}<span style="font-size:0.7em;">個</span></div>
        <div class="filling-sub">必要${e.total}・調理済${e.cooked}</div>
      </div>
      <div class="filling-chevron">›</div>
    </div>
  `;

  let html = remaining.map(rowHtml).join("");
  if(done.length > 0){
    html += `<hr class="section-divider"><div class="done-section-label">完了（${done.length}件）</div>`;
    html += done.map(rowHtml).join("");
  }
  area.innerHTML = html;

  area.querySelectorAll(".filling-row").forEach(el => {
    el.addEventListener("click", () => openFillingDetail(el.dataset.filling));
  });

  noteEl.textContent = `選択中：${selectedIsos.length}日分`;
}

/* ---------- 具材の詳細（日付×渡し先ごとの内訳とチェック） ---------- */
function openFillingDetail(filling){
  state.openFilling = filling;
  state.conflictNotice = null;
  document.getElementById("modalFillingName").textContent = filling;
  renderFillingDetailBody();
  document.getElementById("detailModal").classList.add("show");
  document.body.style.overflow = "hidden";
}
function closeFillingDetail(){
  document.getElementById("detailModal").classList.remove("show");
  document.body.style.overflow = "";
  state.openFilling = null;
}

function renderFillingDetailBody(){
  const filling = state.openFilling;
  const body = document.getElementById("modalBody");
  if(!filling){ body.innerHTML = ""; return; }

  const selectedIsos = [...state.selected].sort();
  const rows = buildRows(selectedIsos).filter(r => r.filling === filling);
  const remainingTotal = rows.reduce((s, r) => s + (getStatus(r.iso, r.dest, r.filling).cooked ? 0 : r.qty), 0);

  if(rows.length === 0){
    body.innerHTML = `<p class="off-note">この具材の内訳がありません。</p>`;
    return;
  }

  let html = `
    <div class="modal-bulk-row">
      <button type="button" class="bulk-complete-btn" id="bulkCompleteBtn" ${remainingTotal === 0 ? "disabled" : ""}>
        選んだ日の分をまとめて調理済みにする（残り${remainingTotal}個）
      </button>
    </div>
    <div id="conflictMsgArea">${state.conflictNotice ? `<p class="conflict-msg">⚠️ ${escapeHtml(state.conflictNotice)}</p>` : ""}</div>
  `;

  const byIso = {};
  rows.forEach(r => { if(!byIso[r.iso]) byIso[r.iso] = []; byIso[r.iso].push(r); });

  selectedIsos.forEach(iso => {
    const dayRows = byIso[iso];
    if(!dayRows || dayRows.length === 0) return;
    const d = new Date(`${iso}T00:00:00`);
    html += `<div class="detail-day-heading">${d.getMonth() + 1}/${d.getDate()}（${DAY_NAMES[d.getDay()]}）</div>`;
    dayRows.forEach(r => {
      const st = getStatus(r.iso, r.dest, r.filling);
      const handedLabel = r.destType === "member" ? "渡し済み" : "用意済み";
      html += `
        <div class="detail-row" data-iso="${r.iso}" data-dest="${escapeHtml(r.dest)}">
          <div class="detail-row-head">
            <span class="detail-dest-name">${escapeHtml(r.dest)}</span>
            <span class="detail-qty">${r.qty}個</span>
          </div>
          <div class="detail-btn-row">
            <button type="button" class="status-btn cooked ${st.cooked ? "active" : ""}" data-kind="cooked">調理済み${st.cooked ? "✓" : ""}</button>
            <button type="button" class="status-btn handed ${st.handed ? "active" : ""}" data-kind="handed">${handedLabel}${st.handed ? "✓" : ""}</button>
          </div>
        </div>
      `;
    });
  });

  body.innerHTML = html;

  const bulkBtn = document.getElementById("bulkCompleteBtn");
  if(bulkBtn) bulkBtn.addEventListener("click", () => bulkCompleteFilling(filling, rows));

  body.querySelectorAll(".detail-row").forEach(rowEl => {
    const iso = rowEl.dataset.iso;
    const dest = rowEl.dataset.dest;
    rowEl.querySelectorAll(".status-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const kind = btn.dataset.kind;
        const current = getStatus(iso, dest, filling);
        const nextVal = { ...current, [kind]: !current[kind] };
        const label = kind === "cooked" ? "調理済み" : (rows.find(r => r.iso === iso && r.dest === dest).destType === "member" ? "渡し済み" : "用意済み");
        const actionLabel = nextVal[kind] ? label : `未${label}`;
        showConfirm(`${dest}の${filling}（${iso}）を『${actionLabel}』にしますか？`, async () => {
          btn.disabled = true;
          const result = await saveCellStatus(iso, dest, filling, kind === "handed" ? nextVal.handed : current.handed, kind === "cooked" ? nextVal.cooked : current.cooked);
          state.conflictNotice = result.conflict ? CONFLICT_MESSAGE : null;
          renderFillingDetailBody();
          renderChecklist();
        });
      });
    });
  });
}

// 競合発生時のメッセージはstate.conflictNoticeに保持し、renderFillingDetailBody()の
// 再描画のたびに#conflictMsgAreaへ反映する（DOMへ直接書き込むと直後の再描画で
// 消えてしまうため、必ずstate経由にする）
const CONFLICT_MESSAGE = "他の端末で更新されています。更新してから操作してください";
function showConflictMessage(){
  state.conflictNotice = CONFLICT_MESSAGE;
}

async function bulkCompleteFilling(filling, rows){
  const uncooked = rows.filter(r => !getStatus(r.iso, r.dest, r.filling).cooked);
  if(uncooked.length === 0) return;
  showConfirm(`選んだ日の${filling}（${uncooked.length}件）をまとめて調理済みにしますか？`, async () => {
    // 1回のスナップショットで全行まとめて競合確認してからまとめて送信する
    // （行ごとに個別フェッチすると件数分だけ通信が増えて遅くなるため）
    const snapshot = await fetchCellStatusSnapshot();
    const toSave = [];
    let conflictCount = 0;
    uncooked.forEach(r => {
      const current = getStatus(r.iso, r.dest, r.filling);
      const latestRaw = snapshot && snapshot[r.iso] && snapshot[r.iso][r.dest] && snapshot[r.iso][r.dest][r.filling]
        ? snapshot[r.iso][r.dest][r.filling].updatedAtRaw : null;
      if(snapshot !== undefined && current.updatedAtRaw && latestRaw && latestRaw !== current.updatedAtRaw){
        conflictCount++;
        return;
      }
      toSave.push(r);
    });

    try{
      await Promise.all(toSave.map(r => {
        const current = getStatus(r.iso, r.dest, r.filling);
        return postCellStatus(r.iso, r.dest, r.filling, current.handed, true, current.updatedAtRaw);
      }));
      const after = await fetchCellStatusSnapshot();
      toSave.forEach(r => {
        const current = getStatus(r.iso, r.dest, r.filling);
        const latestRaw = after && after[r.iso] && after[r.iso][r.dest] && after[r.iso][r.dest][r.filling]
          ? after[r.iso][r.dest][r.filling].updatedAtRaw : null;
        setStatus(r.iso, r.dest, r.filling, { handed: current.handed, cooked: true, updatedAtRaw: latestRaw !== null ? latestRaw : current.updatedAtRaw });
      });
    }catch(e){
      console.error("まとめて調理済みの保存に失敗しました", e);
    }
    if(conflictCount > 0) showConflictMessage();
    renderFillingDetailBody();
    renderChecklist();
  });
}

/* ---------- 具材ステータスの保存（楽観的ロック付き） ---------- */
// 保存直前に、読み込んだ時点からスプレッドシート側の更新日時が変わっていないか確認する
// （2つの端末・admin.htmlで同じ行を操作していた場合、後からの保存が先の保存を
// 　黙って上書きするのを防ぐ）。確認できなかった場合（オフライン等）は保存自体はブロックしない。
async function fetchCellStatusSnapshot(){
  try{
    const json = await fetchGvizSheet(SHIFT_SPREADSHEET_ID, "具材ステータス");
    return parseCellStatusSheet(json);
  }catch(e){
    console.error("具材ステータスの最新状態の取得に失敗しました", e);
    return undefined;
  }
}

// 楽観的ロックの確認を行わず、POSTのみ行う（呼び出し側が確認済みの場合に使う）
async function postCellStatus(iso, dest, filling, handed, cooked, expectedUpdatedAt){
  const payload = { type: "saveStatus", date: iso, member: dest, filling, handed: !!handed, cooked: !!cooked, expectedUpdatedAt: expectedUpdatedAt || undefined };
  await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
}

async function saveCellStatus(iso, dest, filling, handed, cooked){
  const current = getStatus(iso, dest, filling);

  if(current.updatedAtRaw){
    const snapshot = await fetchCellStatusSnapshot();
    const latestRaw = snapshot && snapshot[iso] && snapshot[iso][dest] && snapshot[iso][dest][filling]
      ? snapshot[iso][dest][filling].updatedAtRaw : null;
    if(snapshot !== undefined && latestRaw && latestRaw !== current.updatedAtRaw){
      return { conflict: true };
    }
  }

  try{
    await postCellStatus(iso, dest, filling, handed, cooked, current.updatedAtRaw);
    const after = await fetchCellStatusSnapshot();
    const latestRaw = after && after[iso] && after[iso][dest] && after[iso][dest][filling]
      ? after[iso][dest][filling].updatedAtRaw : null;
    setStatus(iso, dest, filling, { handed: !!handed, cooked: !!cooked, updatedAtRaw: latestRaw !== null ? latestRaw : current.updatedAtRaw });
    return { conflict: false };
  }catch(e){
    console.error("ステータス保存失敗:", e);
    return { error: true };
  }
}

/* ---------- 確認ダイアログ（admin.htmlと同じ仕組み） ---------- */
function showConfirm(message, onConfirm){
  const overlay = document.getElementById("confirmOverlay");
  const yesBtn  = document.getElementById("confirmYesBtn");
  const noBtn   = document.getElementById("confirmNoBtn");
  document.getElementById("confirmMessage").textContent = message;

  function cleanup(){
    overlay.classList.remove("show");
    yesBtn.removeEventListener("click", yesHandler);
    noBtn.removeEventListener("click", noHandler);
    overlay.removeEventListener("click", overlayHandler);
  }
  function yesHandler(){ cleanup(); onConfirm(); }
  function noHandler(){ cleanup(); }
  function overlayHandler(e){ if(e.target === overlay) cleanup(); }

  yesBtn.addEventListener("click", yesHandler);
  noBtn.addEventListener("click", noHandler);
  overlay.addEventListener("click", overlayHandler);
  overlay.classList.add("show");
}

/* ---------- 読み込み・更新 ---------- */
// 手動の「更新」ボタンのみでデータを再取得する（自動の定期更新は行わない）。
// ページを開いただけ・更新ボタンを押しただけでは、具材ステータス・確定プラン・作業中プランの
// いずれにも書き込まない（読み込みのみ）。
async function loadAllData(){
  const [draftJson, chiseJson, confirmedJson, statusJson] = await Promise.all([
    fetchGvizSheet(SHIFT_SPREADSHEET_ID, "作業中プラン").catch(() => null),
    fetchGvizSheet(CHISE_SPREADSHEET_ID, null).catch(() => null),
    fetchGvizSheet(SHIFT_SPREADSHEET_ID, "確定プラン").catch(() => null),
    fetchGvizSheet(SHIFT_SPREADSHEET_ID, "具材ステータス").catch(() => null),
  ]);
  state.draftByDate = parseDraftByDate(draftJson);
  state.chiseByLabel = parseChiseSheet(chiseJson);
  state.confirmedPlanByDate = parseConfirmedPlansSheet(confirmedJson);
  state.cellStatus = parseCellStatusSheet(statusJson);

  const prevCandidateIsos = new Set(state.candidates.map(d => d.iso));
  state.candidates = buildCandidateDates();
  const candidateIsos = new Set(state.candidates.map(d => d.iso));

  // 候補日が変わっていなければ選択状態はそのまま保つ。選択していた日が候補から
  // 消えていた場合はその日だけ選択解除する（表示の便利機能としてlocalStorageを使うのみで、
  // 選択状態自体は候補日の整合性を優先する）
  [...state.selected].forEach(iso => { if(!candidateIsos.has(iso)) state.selected.delete(iso); });

  renderDateList();
  renderChecklist();
  if(state.openFilling) renderFillingDetailBody();

  return { prevCandidateIsos, candidateIsos };
}

async function handleRefresh(){
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true;
  btn.classList.add("loading");
  const originalText = btn.textContent;
  btn.textContent = "更新中...";
  try{
    await loadAllData();
    btn.textContent = "✓ 更新しました";
  }catch(e){
    console.error("更新に失敗しました", e);
    btn.textContent = "✕ 失敗しました";
  }finally{
    setTimeout(() => { btn.disabled = false; btn.classList.remove("loading"); btn.textContent = originalText; }, 1800);
  }
}

async function init(){
  renderPresetButtons();
  document.getElementById("refreshBtn").addEventListener("click", handleRefresh);
  document.getElementById("modalCloseBtn").addEventListener("click", closeFillingDetail);
  document.getElementById("detailModal").addEventListener("click", e => {
    if(e.target === document.getElementById("detailModal")) closeFillingDetail();
  });

  try{
    await loadAllData();
    // 初期表示は「明日」。localStorageに保存済みの選択（候補日と突き合わせて有効なものだけ）が
    // あればそれを復元し、無ければ既定で「明日」を選ぶ（表示の便利機能としてのみ使う）
    const stored = loadSelectedFromStorage();
    const candidateIsos = new Set(state.candidates.map(d => d.iso));
    const restored = (stored || []).filter(iso => candidateIsos.has(iso));
    if(restored.length > 0){
      state.selected = new Set(restored);
    } else {
      state.selected = new Set(presetDates("tomorrow"));
    }
    renderDateList();
    renderChecklist();
  }catch(e){
    console.error("初期読み込みに失敗しました", e);
    document.getElementById("dateListArea").innerHTML = `<p class="off-note">データの取得に失敗しました。更新ボタンで再度お試しください。</p>`;
  }
}
init();
</script>
